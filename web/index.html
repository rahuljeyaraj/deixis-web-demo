<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Put that here</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Ccircle cx='8' cy='8' r='6' fill='%23ff4081'/%3E%3C/svg%3E" />
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <main id="app">
      <div id="bubble" aria-live="polite"></div>
      <div id="stage">
        <canvas id="scene"></canvas>
        <canvas id="hand"></canvas>
        <div id="cam-box" aria-label="Your camera">
          <video id="cam" muted playsinline></video>
          <canvas id="cam-dots"></canvas>
          <span id="cam-label">made-up hand</span>
        </div>
        <button id="camera-btn" type="button">Use my camera and mic</button>
        <div id="status">Loading the arm…</div>
      </div>
      <div id="controls">
        <button id="talk-btn" type="button" title="Hold to talk (or hold the space bar). A quick tap listens until you tap again.">Hold to talk</button>
        <button id="go-btn" class="plain" type="button" title="Do it (same as saying yes). Key: Enter">Go</button>
        <button id="undo-btn" class="plain" type="button" title="Put the last block back">Undo</button>
        <button id="reset-btn" class="plain" type="button" title="New blocks. Key: R">Reset blocks</button>
        <button id="stop-btn" class="plain stop" type="button" title="Stop the arm. Key: Esc">Stop</button>
      </div>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
