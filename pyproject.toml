[project]
name = "deixis-web-demo"
version = "0.1.0"
description = "Point at a block and say 'put that here': a virtual SO-101 arm told where by your finger and voice, through the deixis core"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11,<3.13"
authors = [{ name = "Rahul Jeyaraj" }]
dependencies = [
    "deixis[mcp]",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "python-multipart>=0.0.9",
    "pydantic-settings>=2.3",
    "numpy>=1.26",
    "openai>=1.40",
    "sherpa-onnx>=1.12",
    "onnxruntime>=1.18",
]

[project.scripts]
webdemo = "webdemo.app:main"

[dependency-groups]
dev = [
    "httpx>=0.27",
    "pytest>=8",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["server/webdemo"]

[tool.uv]
# Use a uv-managed CPython, never a Python that happens to be first on PATH.
python-preference = "only-managed"

[tool.uv.sources]
# The core lives next to this repo (C:\work\deixis). The Docker build switches to its git
# tag once it is pushed (plan W14, core task C20).
deixis = { path = "../deixis", editable = true }

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["server", "tests"]
addopts = "--import-mode=importlib -m 'not network'"
markers = [
    "network: needs internet access, model downloads or API keys",
]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["server", "tests", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.isort]
known-first-party = ["deixis", "webdemo"]
